#!/usr/bin/env -S "populate_pre_commit"
# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

# managed-by-populate-pre-commit start: header
# Install all the hook types I use rather than just pre-commit.
default_install_hook_types: [pre-commit, pre-push, commit-msg]

# https://prek.j178.dev/benchmark/?h=priority#3-priority
priorities:
    generator: 10
    formatter: 20
    formatter-late: 25
    linter: 30
    tests: 40
    coverage: 50
# managed-by-populate-pre-commit end: header

repos:
  # managed-by-populate-pre-commit start: actionlint.yaml
  - repo: local
    hooks:
    - id: actionlint
      name: Run `actionlint`
      priority: linter
      language: system
      types:
      - yaml
      exclude: dependabot.yml|.*.yaml$
      entry: actionlint
  # managed-by-populate-pre-commit end: actionlint.yaml
  # managed-by-populate-pre-commit start: always_enabled.yaml
  - repo: meta
    hooks:
    - id: check-hooks-apply
      priority: linter
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.5.0
    hooks:
    - id: conventional-pre-commit
      priority: linter
      stages:
      - commit-msg
      args:
      - --verbose
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    - id: check-case-conflict
      priority: linter
    - id: check-executables-have-shebangs
      priority: linter
    - id: check-illegal-windows-names
      priority: linter
    - id: check-merge-conflict
      priority: linter
    - id: check-vcs-permalinks
      priority: linter
    - id: check-yaml
      priority: linter
    - id: destroyed-symlinks
      priority: linter
    - id: fix-byte-order-marker
      priority: linter
    - id: mixed-line-ending
      priority: linter
  - repo: local
    hooks:
    - id: make_github_workflows
      name: Run `make_github_workflows`
      priority: generator
      language: system
      always_run: true
      pass_filenames: false
      entry: env ./.github/dependabot.yml
  - repo: local
    hooks:
    - id: populate_pre_commit
      name: Run `populate_pre_commit`
      priority: generator
      language: system
      always_run: true
      pass_filenames: false
      entry: env ./.pre-commit-config.yaml
  - repo: local
    hooks:
    - id: spellcheck
      stages:
      - commit-msg
      name: Check spelling
      priority: linter
      language: system
      verbose: true
      entry: spell-check-wrapper
  # managed-by-populate-pre-commit end: always_enabled.yaml
  # managed-by-populate-pre-commit start: json.yaml
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    - id: check-json
      priority: linter
      exclude: ^\.vscode/settings\.json|package-lock\.json$
    - id: pretty-format-json
      priority: formatter
      exclude: ^\.vscode/settings\.json|package-lock\.json$
      args:
      - --autofix
  # managed-by-populate-pre-commit end: json.yaml
  # managed-by-populate-pre-commit start: markdown.yaml
  - repo: local
    hooks:
    - id: markdownlint
      name: Run `markdownlint`
      priority: linter
      language: system
      types:
      - markdown
      exclude: CODE_OF_CONDUCT.md
      entry: markdownlint
  - repo: local
    hooks:
    - id: mermaid-pre-commit
      name: Run `mermaid-pre-commit`
      priority: linter
      language: system
      types:
      - markdown
      entry: mermaid-pre-commit
  # managed-by-populate-pre-commit end: markdown.yaml
  # managed-by-populate-pre-commit start: mdformat.yaml
  - repo: local
    hooks:
    - id: mdformat
      name: Run `mdformat`
      priority: linter
      language: system
      types:
      - markdown
      exclude: ^(CODE_OF_CONDUCT\.md|README\.md)$
      entry: mdformat
  # managed-by-populate-pre-commit end: mdformat.yaml
  # managed-by-populate-pre-commit start: shellcheck.yaml
  - repo: local
    hooks:
    - id: shellcheck
      name: Run `shellcheck`
      priority: linter
      language: system
      types:
      - shell
      entry: shellcheck -e SC1090 -e SC1091
  # managed-by-populate-pre-commit end: shellcheck.yaml
  # managed-by-populate-pre-commit start: toml.yaml
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    - id: check-toml
      priority: linter
  # managed-by-populate-pre-commit end: toml.yaml
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: local
    hooks:
      # keep-sorted start
      - id: luac
        name: Run `luac` if it's installed
        language: system
        types: [lua]
        entry: run-if-exists luac -p
      - id: luacheck
        name: Run `luacheck` if it's installed
        language: system
        types: [lua]
        # Ideally this would use the same args as
        # .config/nvim/lua/plugins/lint.lua does.
        entry: run-if-exists luacheck --globals vim table.unpack --std +lua51 --std +busted --codes --ranges
      - id: sort-gemini-settings
        name: Sort Gemini settings file.
        language: system
        files: .gemini/antigravity-cli/settings.json
        entry: sort-json
      - id: sort-spell-file
        name: Sort vim's spell file.
        language: system
        files: .config/nvim/spell/en.utf-8.add
        pass_filenames: false
        entry: sort -u -o .config/nvim/spell/en.utf-8.add .config/nvim/spell/en.utf-8.add
      - id: tools-test
        name: Run tests for tools.lua
        language: system
        entry: ./.config/nvim/lua/johntobin/tools_test.sh
        files: .config/nvim/lua/johntobin/tools*
      # keep-sorted end
